# SIGON Colab train policy (2026-07-25)
# Parallel instance = one simulated env (one day × one symbol × one goal/risk draw).
#
# DAY RETRIES (Monty):
#   If that instance FAILS the day (miss target or breach),
#   it may retry the SAME day setup up to max_day_retries times.
#   If still fail → that instance's streak climb RESTARTS at day 1
#   (draws a new day; does NOT wipe the whole train).
max_day_retries: 3

# Champion = new all-time-high consistency STREAK with breach 0%.
champion:
  path: models/best_sigon.pt
  named_pattern: models/best_sigon_streak{streak:02d}.pt
  history_pattern: models/history/SIGON_streak{streak:02d}_obs{obs_dim}_SN-{serial}.pt
  record_json: models/best_sigon_record.json
  lock_requires_breach_zero: true

meta:
  full_knob_access: true
  adopt_requires_clear_up_breach_zero: true
  w_pullback_with_htf_may_rise: true

# ---- Colab / SIGON ~6820 VRAM ----
# Full multi-year × 4 symbols is ~17GB of day tensors alone → OOM on free Colab.
# Cap days per symbol (still trains ALL 4 symbols; uses recent history).
max_days_per_symbol: 120

# Parallel envs. SIGON obs is ~4× larger than old 1820 — use fewer instances.
# OOM? drop: 512 → 256 → 128
instances_default: 512
instances_oom_fallback: [256, 128, 64]
env_mb_default: 64

default_entropy_coef_hint: 0.03
