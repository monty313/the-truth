# SIGON Colab train policy (2026-07-25)
# Parallel instance = one simulated env (one day × one symbol × one goal/risk draw).
#
# DAY RETRIES (Monty):
#   If that instance FAILS the day (miss target or approach breach handling),
#   it may retry the SAME day setup up to max_day_retries times before that
#   instance resets / draws a new day. This is per parallel instance, not global.
max_day_retries: 3

# Champion = highest consistency policy only (no ceremony prove-to-human ladder).
# Always keep/overwrite best_sigon when clear rate improves and breach stays 0.
champion:
  path: artifacts/checkpoints/best_sigon.pt
  record_json: artifacts/checkpoints/best_sigon_record.json
  # record fields: clear_rate, breach_rate, row, obs_dim, symbols, updated_at

# Meta has full access to all reward weights + PPO hypers in training/meta_tuner BOUNDS.
# LLM (CMO) may read meta state under artifacts/llm_curriculum/ and propose gated updates.
meta:
  full_knob_access: true
  adopt_requires_clear_up_breach_zero: true
  w_pullback_with_htf_may_rise: true   # Policy disease: raise if hold-on-setup persists

# Speed: prefer high instance counts (GPU ≥70% util).
instances_default: 8000
instances_oom_fallback: [4000, 2000, 1024]
