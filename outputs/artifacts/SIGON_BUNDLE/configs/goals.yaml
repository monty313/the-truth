# WHO: Monty's typed inputs. WHAT: goal/floor + day rules.
# RUNTIME INPUTS (do not retrain to change these):
#   - goal_pct / floor_pct = optional HUD defaults; training focus pair is below
#   - Brain sees goal & floor in obs self-state every step (ANY-X conditioning)
#   - Meta-tuner optimizes rewards/hypers for consistency ACROSS the ranges
#   - prove_it BRAIN TARGET RISK → measure SAME brain at ANY pair without retrain
# CHANGE LOG:
# - 2026-07-25  sampling law 40% @ 2.5/3.5 + ranges 2.5–70.5 / 1–4 — WHY: Monty Colab SIGON meta law
# - 2026-07-25  document goal/floor as runtime variables

goal_pct: 2.5          # default focus target % (40% of train days use this with floor_pct)
floor_pct: 3.5         # default focus risk %
equity_basis: equity
currency: USD
day_boundary_tz: Europe/Berlin
midnight_buffer_min: 0
flat_at_reset: true
ratchet:
  enabled: true
  mode: peak
  trail_keep_frac: 0.25
  activation_buffer_heat_aware: true

goal_conditioning:
  randomize_in_training: true
  # TRAINING LAW (Monty 2026-07-25 — single source; notebook + FastSim + auto_ranges must match):
  #   40% of practice days → target 2.5% and risk 3.5% (focus pair)
  #   60% of practice days → target uniform in goal_range, risk uniform in floor_range
  focus_frac: 0.40
  focus_target: 2.5
  focus_risk: 3.5
  goal_range: [2.5, 70.5]
  floor_range: [1.0, 4.0]

bar_ruling:
  decided: 2026-07-19
  bar: "2x-goal-every-day"
  decision: keep
  acknowledged_warning: true
  evidence: "gauntlet REAL_XAUUSD 2026-04-27..05-26 (21d): oracle +4.63%/day avg, min +2.08%, 0 breaches, cleared +5% on 9/21 days"

account_mode: personal
ftmo_future:
  target_pct: 2.5
  daily_loss_pct: 5.0
  max_loss_pct: 10.0
  trailing_pct: 4.0
  stop_at_target: true
  early_flatten_buffer_pct: 0.1
