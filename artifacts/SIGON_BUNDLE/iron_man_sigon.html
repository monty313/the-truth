<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIGON Iron Man Board</title>
  <style>
    :root { --bg: #0a0e14; --fg: #e6edf3; --mut: #8b949e; --ok: #3fb950; --bad: #f85149; --mid: #d29922; }
    body { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
           background: radial-gradient(900px 500px at 20% -10%, #1a2332 0, var(--bg) 55%);
           color: var(--fg); min-height: 100vh; }
    header { padding: 16px 20px; border-bottom: 1px solid #21262d; display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline; }
    h1 { font-size: 15px; letter-spacing: 2px; margin: 0; font-weight: 700; }
    .stat { color: var(--mut); font-size: 12px; }
    .stat b { color: var(--fg); }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; padding: 16px; }
    .cell { background: #121820; border: 1px solid #21262d; border-radius: 8px; padding: 8px 6px; text-align: center; }
    .cell .e { font-size: 20px; line-height: 1.2; }
    .cell .m { font-size: 10px; color: var(--mut); margin-top: 4px; }
    .cell.clear { border-color: #238636; }
    .cell.breach { border-color: #da3633; }
    .cell.miss { border-color: #9e6a03; }
    footer { padding: 12px 20px 24px; color: var(--mut); font-size: 11px; }
    #err { color: var(--bad); padding: 12px 20px; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>SIGON · DAY BOARD</h1>
    <div class="stat">updated <b id="ts">—</b></div>
    <div class="stat">clear <b id="cr">—</b></div>
    <div class="stat">breach <b id="br">—</b></div>
    <div class="stat">row <b id="row">—</b></div>
    <div class="stat">obs <b id="obs">—</b></div>
    <div class="stat">batch <b id="n">—</b></div>
  </header>
  <div id="err"></div>
  <div id="grid"></div>
  <footer>
    Legend: 🟢 clear · 🔴 breach · 🟡 green miss · ⚪ pending · 🔵 active<br/>
    Reads <code>../artifacts/llm_curriculum/day_board.json</code> every 15s (serve repo root or open via local server).
  </footer>
  <script>
    const PATHS = [
      "../artifacts/llm_curriculum/day_board.json",
      "artifacts/llm_curriculum/day_board.json",
      "/artifacts/llm_curriculum/day_board.json",
    ];
    async function loadBoard() {
      const err = document.getElementById("err");
      let data = null, lastErr = null;
      for (const p of PATHS) {
        try {
          const r = await fetch(p + "?t=" + Date.now(), { cache: "no-store" });
          if (!r.ok) throw new Error(p + " " + r.status);
          data = await r.json();
          break;
        } catch (e) { lastErr = e; }
      }
      if (!data) {
        err.style.display = "block";
        err.textContent = "Board not reachable yet (start gpu_train). " + (lastErr || "");
        return;
      }
      err.style.display = "none";
      document.getElementById("ts").textContent = data.updated_at || "—";
      document.getElementById("cr").textContent = data.clear_rate != null ? (100 * data.clear_rate).toFixed(1) + "%" : "—";
      document.getElementById("br").textContent = data.breach_rate != null ? (100 * data.breach_rate).toFixed(2) + "%" : "—";
      document.getElementById("row").textContent = data.row != null ? data.row : "—";
      document.getElementById("obs").textContent = data.obs_dim != null ? data.obs_dim : "—";
      document.getElementById("n").textContent = data.n != null ? data.n : "—";
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      (data.rows || []).forEach(row => {
        const d = document.createElement("div");
        d.className = "cell " + (row.status || "");
        const sym = row.symbol ? row.symbol + " · " : "";
        d.innerHTML = `<div class="e">${row.emoji || "⚪"}</div>
          <div class="m">${sym}${row.pnl != null ? row.pnl.toFixed(2) : "—"}%</div>
          <div class="m">t${row.target != null ? row.target.toFixed(1) : "—"}</div>`;
        grid.appendChild(d);
      });
    }
    loadBoard();
    setInterval(loadBoard, 15000);
  </script>
</body>
</html>
