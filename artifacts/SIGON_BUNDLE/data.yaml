# WHAT: data sources + audit thresholds (Phase 3).
# CHANGE LOG:
# - 2026-07-25  SIGON multi-symbol note — WHY: gpu_train --csv-dir data pools XAUUSD+EURUSD+GBPUSD+US30.
m1_csv_dir: data                 # repo-local M1 curricula (also ../data on some hosts)
symbols: {bootcamp: XAUUSD, expansion: [EURUSD, GBPUSD, US30]}
# Place M1 CSVs as data/XAUUSD_curriculum_*.csv (required), plus EURUSD/GBPUSD/US30 when ready.
# Missing expansion symbols are skipped; training continues on whatever is present.
audit: {max_gap_minutes_flag: 120, spread_spike_flag_mult: 8}
synthetic_fallback: true         # ADR-0010: used overnight until the zip lands
point_size: 0.01                 # gold; per-symbol table at expansion
contract_size: 100.0             # gold oz per 1.0 lot (0.01 lot = 1 unit)
broker_tz: Europe/Athens         # FTMO-style EET/EEST assumption — VERIFY on real data (audit S2)
convert_to_day_tz: true          # convert stamps to goals.day_boundary_tz before day-split
