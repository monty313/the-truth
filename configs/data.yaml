# WHAT: data sources + audit thresholds (Phase 3).
# CHANGE LOG:
# - 2026-07-25  SIGON multi-symbol + cache plain-English + spread notes — WHY: Colab 4-symbol pool.
#
# ── CACHE (plain English) ──────────────────────────────────────────
# A CACHE is a saved shortcut of features per CSV/symbol. After signals ON
# or new symbols land in data/, DELETE once:
#   artifacts/gpu_cache_*.npz
#   artifacts/symbol_cache/*
# Then rebuild on the next train. NEVER delete .pt checkpoints when clearing caches.
# ───────────────────────────────────────────────────────────────────
m1_csv_dir: data
symbols:
  bootcamp: XAUUSD
  expansion: [EURUSD, GBPUSD, US30]
# Place M1 CSVs as data/XAUUSD_curriculum_*.csv (required), plus EURUSD/GBPUSD/US30 when ready.
# Missing expansion symbols are skipped; training continues on whatever is present.
#
# Spread / fees (training context):
#   XAUUSD & US30 — typically razor-thin spread, often no transaction fees on prop-style
#   accounts; costs show mainly as spread points in the sim.
#   EURUSD / GBPUSD — normal FX spreads; brain sees normalized obs::spread_rel.
# The policy must respect spread_rel, not assume free fills on every symbol.
audit: {max_gap_minutes_flag: 120, price_spike_flag_mult: 8}
synthetic_fallback: true
point_size: 0.01                 # gold default; per-symbol in training.gpu_data.SYMBOL_SPECS
contract_size: 100.0
broker_tz: Europe/Athens
convert_to_day_tz: true
