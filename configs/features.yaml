# WHAT: observation space per ADR-0004/0008 + Monty's physics spec.
# CHANGE LOG:
# - 2026-08-04  sets_lock proven_legacy | mark — WHY: policy=Mark on chart needs
#               correct 1m/15m/30m · 5m/30m/1h · 15m/1h/4h · 30m/4h/1d for NEW
#               trains; PROVEN stays on proven_legacy (see POLICY_EQUALS_MARK_ON_CHART.md).
# - 2026-07-25  SIGON path: include_signal_agent_slots true for NEW lineage only — WHY: all signal agents in obs
# - 2026-07-25  cache plain-English warning — WHY: no more 6820 vs 1820 confusion

# SETS LOCK (semantic obs):
#   proven_legacy = PROVEN_* compatible stacks (2026-07-24 wrong set2/set3 vs Mark law)
#   mark          = Mark-on-chart stacks — NEW brain only; wipe gpu_cache; no PROVEN warm-start
sets_lock: proven_legacy

frame_stack: 10
no_raw_prices: true
include:
  cci: {periods: [30, 100], applied_sma: {period: 2, shift: 2}}
  s2_bb: {wide: {period: 100, dev: 0.5, shift: 2}, fast: {period: 10, dev: 0.5, shift: 2}, sma_filter: 50}
  envelope: {period: 4, htf_shift: 4, ltf_shift: 2}
  s4_rsi: {fast: 2, slow: 20, bb: {period: 20, dev: 0.5, shift: 2}}
  atr: {periods: [5, 14]}
  state_flags_and_strengths: true
  spread: true    # obs::spread_rel — bot must see cost-to-open before committing
  session_clock: true
  self_state: [goal, floor, dist_to_goal, dist_to_floor, ratchet_level, win_rate_today,
               streak_days, open_risk, position, unrealized_pnl, bars_in_trade,
               trades_used_today]
  sauces_observation_only: {dimension_jump: true, mcflurry: true}
normalization: per_feature_rolling

# ---------------------------------------------------------------------------
# SIGNAL AGENT SLOTS (sig_000 .. sig_499)
# ---------------------------------------------------------------------------
# TRUE  = NEW brain lineage (~6820 frame_dim). All registered signal agents feed obs.
# FALSE = PROVEN_* compatible (1820). Do not load PROVEN into TRUE or you get shape crash.
#
# CACHE (plain English):
#   Cache files are shortcuts of already-built features.
#   After flipping this flag or changing symbols/engine, DELETE once:
#     artifacts/gpu_cache_*.npz
#     artifacts/symbol_cache/*
#   Then rebuild. Otherwise old columns + new brain = mismatch. Never delete .pt checkpoints
#   when clearing caches.
# ---------------------------------------------------------------------------
include_signal_agent_slots: false
