# WHAT: the 4-Set Interlocking Matrix — chart law for Momentum One / Mark.
# CHANGE LOG:
# - 2026-08-04  dual lock: sets_mark (policy=Mark on chart) + sets_proven_legacy
#               (frozen PROVEN obs). Default active selection via features.sets_lock.
#               WHY: 2026-07-24 lock had wrong set2/set3 HTFs vs Monty Mark stacks.
# - 2026-07-24  set2 HTFs -> 1h,4h; set3 HTFs -> 4h,1d — WHY: then-Monty lock
#               (NOW proven_legacy only).
#
# MARK LOCK (LTF = first; last two = HTF confirmation):
#   set1: 1m  | 15m, 30m
#   set2: 5m  | 30m, 1h
#   set3: 15m | 1h, 4h
#   set4: 30m | 4h, 1d
#
# See POLICY_EQUALS_MARK_ON_CHART.md

# Active table name: overridden by features.yaml sets_lock when engine loads.
# Safe default for PROVEN warm-start:
default_sets_lock: proven_legacy

sets_mark:
  set1: {ltf: 1min,  htfs: [15min, 30min], extra: 1h}
  set2: {ltf: 5min,  htfs: [30min, 1h],    extra: 4h}
  set3: {ltf: 15min, htfs: [1h, 4h],       extra: 1d}
  set4: {ltf: 30min, htfs: [4h, 1d],       extra: 1w}

# Frozen for PROVEN_* checkpoints (1820) trained under 2026-07-24 lock.
sets_proven_legacy:
  set1: {ltf: 1min,  htfs: [15min, 30min], extra: 1h}
  set2: {ltf: 5min,  htfs: [1h, 4h],       extra: 1d}
  set3: {ltf: 15min, htfs: [4h, 1d],       extra: 1w}
  set4: {ltf: 30min, htfs: [4h, 1d],       extra: 1w}

# Back-compat key "sets" = proven_legacy until all call sites use resolve_sets().
sets:
  set1: {ltf: 1min,  htfs: [15min, 30min], extra: 1h}
  set2: {ltf: 5min,  htfs: [1h, 4h],       extra: 1d}
  set3: {ltf: 15min, htfs: [4h, 1d],       extra: 1w}
  set4: {ltf: 30min, htfs: [4h, 1d],       extra: 1w}

observation_only: [1w]
