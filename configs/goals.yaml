# WHO: Monty's typed inputs. WHAT: goal/floor + day rules.
# RUNTIME INPUTS (do not retrain to change these):
#   - goal_pct / floor_pct = today's focus pair (edit anytime or pass to prove_it CLI)
#   - Brain sees goal & floor in obs self-state every step (ANY-X conditioning)
#   - Meta-tuner optimizes rewards/hypers for consistency ACROSS the ranges below
#   - prove_it BRAIN TARGET RISK  → measure the SAME brain at ANY pair without retrain
# CHANGE LOG:
# - 2026-07-25  SIGON focus 40% @ 2.5/3.5, ranges 2.5–70.5 / 1.0–4.0 — WHY: Colab sampling law.
# - 2026-07-25  document goal/floor as runtime variables — WHY: Monty changes target/risk anytime.
goal_pct: 2.5          # focus target % (also focus_target under goal_conditioning)
floor_pct: 3.5         # focus risk floor %
equity_basis: equity
currency: USD
day_boundary_tz: Europe/Berlin
midnight_buffer_min: 0
flat_at_reset: true
ratchet:
  enabled: true
  mode: peak
  trail_keep_frac: 0.25
  activation_buffer_heat_aware: true

goal_conditioning:      # ANY-X promise (ADR-0001/0007) — read by evaluation.consistency.auto_ranges
  randomize_in_training: true
  # 40% of practice days fixed at focus_target/focus_risk; 60% random in ranges.
  focus_frac: 0.40
  focus_target: 2.5
  focus_risk: 3.5
  goal_range: [2.5, 70.5]
  floor_range: [1.0, 4.0]

bar_ruling:
  decided: 2026-07-19
  bar: "2x-goal-every-day"
